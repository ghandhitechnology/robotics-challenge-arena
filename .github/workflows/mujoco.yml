name: MuJoCo physics

on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-mujoco.txt
      - run: python -m pip install -r requirements-mujoco.txt
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests/mujoco -p 'test_*.py' -v
      - run: python scripts/test_best_fleet.py
      - run: python scripts/validate_mujoco.py --seconds .02 --output /tmp/mujoco_validation.json
      - run: python scripts/verify_swarm_policy.py
      - run: python scripts/test_swarm_proof.py
      - run: python scripts/test_swarm_evaluation.py
      - run: python scripts/test_swarm_imitation.py
      - run: python scripts/test_swarm_rewards.py
      - run: python scripts/test_swarm_magnets.py
      - run: python scripts/test_swarm_flow.py
      - run: python scripts/test_swarm_body.py
      - run: python scripts/test_swarm_body_proof.py
